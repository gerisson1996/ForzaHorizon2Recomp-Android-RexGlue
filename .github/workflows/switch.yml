name: Switch port bootstrap

on:
  push:
    branches: [switch-port]
  workflow_dispatch:

jobs:
  switch-bootstrap:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Verify devkitA64/libnx toolchain
        shell: bash
        run: |
          set -euxo pipefail
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITA64=${DEVKITA64:-$DEVKITPRO/devkitA64}"
          export DEVKITA64="${DEVKITA64:-$DEVKITPRO/devkitA64}"
          echo "$DEVKITA64/bin" >> "$GITHUB_PATH"
          # devkitPro's devkita64 image may contain the compiler packages
          # without exporting devkitA64 on PATH in non-login CI shells.
          if ! command -v aarch64-none-elf-g++ >/dev/null 2>&1; then
            export PATH="$DEVKITA64/bin:$PATH"
          fi
          if ! command -v aarch64-none-elf-g++ >/dev/null 2>&1; then
            dkp-pacman -Syu --noconfirm
            dkp-pacman -S --needed --noconfirm switch-dev
            export PATH="$DEVKITA64/bin:$PATH"
          fi
          command -v aarch64-none-elf-g++
          aarch64-none-elf-g++ --version
          # libnx is not guaranteed to be present in the minimal devkita64 image.
          if [[ ! -f "$DEVKITPRO/libnx/include/switch.h" ]]; then
            dkp-pacman -S --needed --noconfirm switch-dev
          fi
          test -f "$DEVKITPRO/libnx/include/switch.h"
          ls -l "$DEVKITPRO/libnx/include/switch.h"

      - name: Install host codegen dependencies
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends cmake ninja-build clang git ca-certificates
          cmake --version
          ninja --version
          clang --version

      - name: Host codegen for FH2
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euxo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::GH_PAT is required to fetch the private FH2 XEX inputs for codegen."
            exit 1
          fi
          bash scripts/build_host_codegen.sh
          test -f recomp/generated/default/sources.cmake
          echo "Generated source count:"
          find recomp/generated -name '*.cpp' | wc -l

      - name: Build Switch bootstrap NRO
        shell: bash
        run: |
          set -euxo pipefail
          export DEVKITA64="${DEVKITA64:-$DEVKITPRO/devkitA64}"
          export PATH="$DEVKITA64/bin:$PATH"
          make -C switch -j2
          mkdir -p dist
          cp switch/ForzaHorizon2Recomp-Switch.nro dist/
          cp recomp/generated/default/sources.cmake dist/fh2-generated-sources.cmake

      - name: Upload Switch bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: fh2-switch-bootstrap
          path: |
            dist/ForzaHorizon2Recomp-Switch.nro
            dist/fh2-generated-sources.cmake
          if-no-files-found: error
